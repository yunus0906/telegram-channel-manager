[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-channel-manager-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "telethon>=1.36,<2",
  "python-socks>=2.4,<3",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

